name: CI/CD

on:
  push:
    branches: [v1.0_dev]
  pull_request:
    branches: [v1.0_dev]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-deploy:
    name: Build and deploy (only if tests pass)
    needs: test            # skipped automatically when any test fails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npx expo export --platform web
      - name: Publish build (deploy)
        uses: actions/upload-artifact@v4
        with:
          name: laundryalert-web-${{ github.sha }}
          path: dist
      - name: Build Android APK on EAS (only when EXPO_TOKEN secret exists)
        if: env.EXPO_TOKEN != ''
        run: npx eas-cli@latest build -p android --profile preview-demo --non-interactive --no-wait
